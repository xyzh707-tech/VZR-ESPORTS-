<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#09090b">
<title>VZR ESPORTS | Profile</title>

<style>
:root {
  --bg:#09090b;
  --red:#ed2638;
  --red-glow:rgba(237,38,56,.35);
  --white:#f5f5f7;
  --muted:#9999a3;
  --line:#292930;
  --panel:#17171c;
  --green:#22c55e;
  --gold:#fbbf24;
}

* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; min-height:100%; background:var(--bg); color:var(--white); font-family:Inter,system-ui,Arial,sans-serif; }
body { min-height:100vh; }
button { font:inherit; cursor:pointer; outline:none; }
button:active { filter:brightness(.9); transform:scale(.98); }

/* HEADER */
.header {
  display:flex; align-items:center; justify-content:space-between;
  padding:15px 20px;
  background:var(--panel);
  border-bottom:1px solid var(--line);
  position:sticky; top:0; z-index:10;
}
.header-left { display:flex; align-items:center; gap:14px; }
.back-btn {
  background:transparent; border:0; color:#fff;
  font-size:24px; cursor:pointer; padding:0 4px;
}
.header h1 { font-size:18px; font-weight:800; letter-spacing:.5px; margin:0; }

.wallet-tag {
  background:var(--panel); border:1px solid var(--line); color:#fff;
  padding:7px 13px; border-radius:12px; font-size:12px; font-weight:700;
  display:flex; align-items:center; gap:5px; text-decoration:none;
}
.wallet-tag .coin { color:var(--gold); }

/* CONTAINER */
.container {
  max-width:520px; margin:24px auto; padding:0 16px;
  display:flex; flex-direction:column; gap:18px;
}

/* PROFILE HERO */
.profile-hero {
  position:relative;
  background:linear-gradient(160deg,#1c1c24,#0f0f14);
  border:1px solid #303038;
  border-radius:20px;
  padding:28px 20px 24px;
  text-align:center;
  overflow:hidden;
  box-shadow:0 20px 50px rgba(0,0,0,.6);
}
.profile-hero::before {
  content:"";
  position:absolute;
  top:-50%; left:50%;
  width:400px; height:400px;
  transform:translateX(-50%);
  background:radial-gradient(circle, rgba(237,38,56,.18), transparent 70%);
  pointer-events:none;
}
.avatar {
  position:relative;
  width:88px; height:88px;
  margin:0 auto 14px;
  border-radius:50%;
  background:linear-gradient(135deg,var(--red),#a01525);
  display:flex; align-items:center; justify-content:center;
  font-size:36px; font-weight:900; color:#fff;
  border:3px solid #2a2a32;
  box-shadow:0 10px 30px var(--red-glow);
  z-index:1;
}
.user-name {
  position:relative;
  font-size:20px; font-weight:800;
  color:#fff; margin-bottom:6px;
  z-index:1;
  word-break:break-all;
  padding:0 10px;
}
.model-badge {
  position:relative;
  display:inline-block;
  background:rgba(251,191,36,.12);
  border:1px solid rgba(251,191,36,.35);
  color:#fbbf24;
  padding:4px 12px;
  border-radius:999px;
  font-size:11px;
  font-weight:800;
  letter-spacing:.5px;
  z-index:1;
}

/* INFO CARD */
.info-card {
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:16px;
  overflow:hidden;
}
.info-card-header {
  padding:14px 18px;
  border-bottom:1px solid var(--line);
  background:#1a1a22;
  font-size:11px;
  font-weight:800;
  letter-spacing:1.4px;
  text-transform:uppercase;
  color:var(--muted);
}
.info-row {
  padding:16px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  border-bottom:1px solid var(--line);
}
.info-row:last-child { border-bottom:none; }
.info-row-left {
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
  flex:1;
}
.info-icon {
  width:38px; height:38px;
  border-radius:10px;
  background:rgba(237,38,56,.1);
  border:1px solid rgba(237,38,56,.25);
  display:flex; align-items:center; justify-content:center;
  font-size:17px;
  flex-shrink:0;
}
.info-icon.green { background:rgba(34,197,94,.1); border-color:rgba(34,197,94,.25); }
.info-icon.gold { background:rgba(251,191,36,.1); border-color:rgba(251,191,36,.25); }
.info-label {
  font-size:11px;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:.8px;
  font-weight:700;
  margin-bottom:3px;
}
.info-value {
  font-size:14px;
  color:#fff;
  font-weight:600;
  word-break:break-all;
  line-height:1.35;
}
.info-value.balance {
  font-size:22px;
  font-weight:900;
  color:var(--green);
  display:flex;
  align-items:center;
  gap:4px;
}
.info-value.balance .coin {
  font-size:18px;
  color:var(--gold);
}

/* Password field */
.pass-value {
  font-family:'Courier New', monospace;
  letter-spacing:2px;
  font-size:15px;
  font-weight:800;
  color:#fff;
}
.pass-value.masked {
  letter-spacing:4px;
}
.eye-btn {
  background:#292c36;
  border:0; color:#fff;
  width:36px; height:36px;
  border-radius:8px;
  font-size:15px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}
.eye-btn:active { background:var(--red); }
.copy-btn {
  background:#292c36;
  border:0; color:#fff;
  width:36px; height:36px;
  border-radius:8px;
  font-size:13px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}
.copy-btn:active { background:var(--green); }
.copy-btn.copied { background:var(--green); }

/* COMING SOON */
.coming-soon {
  background:linear-gradient(135deg,#1c1c24,#0f0f14);
  border:1px solid #303038;
  border-radius:20px;
  padding:52px 24px;
  text-align:center;
  position:relative;
  overflow:hidden;
}
.coming-soon::before {
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 30% 20%, rgba(237,38,56,.12), transparent 50%),
    radial-gradient(circle at 70% 80%, rgba(237,38,56,.08), transparent 50%);
  pointer-events:none;
}
.coming-soon-inner {
  position:relative;
  z-index:1;
}
.cs-icon {
  font-size:52px;
  margin-bottom:14px;
  filter:drop-shadow(0 8px 20px rgba(237,38,56,.4));
}
.cs-title {
  font-size:24px;
  font-weight:900;
  letter-spacing:-.5px;
  background:linear-gradient(135deg,#fff,var(--red));
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
  margin-bottom:8px;
}
.cs-sub {
  font-size:13px;
  color:var(--muted);
  line-height:1.6;
  max-width:280px;
  margin:0 auto;
}

/* Logout button */
.logout-btn {
  width:100%;
  background:rgba(237,38,56,.12);
  border:1px solid rgba(237,38,56,.35);
  color:#ff8a96;
  padding:14px;
  border-radius:14px;
  font-size:14px;
  font-weight:800;
  letter-spacing:.5px;
  cursor:pointer;
  transition:.18s;
}
.logout-btn:active {
  background:rgba(237,38,56,.25);
  transform:scale(.98);
}

/* LOADING */
.loading {
  text-align:center;
  padding:60px 20px;
  color:var(--muted);
  font-size:14px;
}

/* Toast */
.toast {
  position:fixed;
  left:50%; bottom:24px;
  transform:translate(-50%,20px);
  opacity:0; pointer-events:none;
  z-index:20;
  background:#24242b;
  border:1px solid #45454e;
  color:#fff;
  padding:12px 18px;
  border-radius:12px;
  font-size:13px;
  font-weight:600;
  transition:.25s;
  max-width:90vw;
  text-align:center;
}
.toast.show { opacity:1; transform:translate(-50%,0); }

@media(max-width:600px) {
  .header { padding:12px 15px; }
  .header h1 { font-size:16px; }
  .container { margin:16px auto; padding:0 14px; gap:14px; }
  .profile-hero { padding:24px 16px 20px; border-radius:18px; }
  .avatar { width:76px; height:76px; font-size:30px; }
  .user-name { font-size:18px; }
  .info-row { padding:14px 15px; gap:10px; }
  .info-icon { width:34px; height:34px; font-size:15px; }
  .info-value { font-size:13px; }
  .info-value.balance { font-size:20px; }
  .pass-value { font-size:13px; letter-spacing:1.5px; }
  .coming-soon { padding:44px 20px; border-radius:18px; }
  .cs-title { font-size:20px; }
  .cs-icon { font-size:44px; }
}
</style>
</head>

<body>

<!-- HEADER -->
<header class="header">
  <div class="header-left">
    <button class="back-btn" onclick="window.location.href='lobby.html'">&lt;</button>
    <h1>My Profile</h1>
  </div>
  <a href="deposit.html" class="wallet-tag">
    <span class="coin">₹</span> <span id="headerWallet">0</span>
  </a>
</header>

<!-- CONTAINER -->
<div class="container">

  <div id="loadingBox" class="loading">Loading profile...</div>

  <div id="profileContent" style="display:none;">

    <!-- PROFILE HERO -->
    <div class="profile-hero">
      <div class="avatar" id="avatarLetter">V</div>
      <div class="user-name" id="userEmail">user@example.com</div>
      <span class="model-badge" id="modelBadge">MODEL: ---</span>
    </div>

    <!-- ACCOUNT INFO -->
    <div class="info-card">
      <div class="info-card-header">Account Details</div>

      <!-- EMAIL -->
      <div class="info-row">
        <div class="info-row-left">
          <div class="info-icon">📧</div>
          <div style="min-width:0">
            <div class="info-label">Email</div>
            <div class="info-value" id="emailValue">---</div>
          </div>
        </div>
      </div>

      <!-- PASSWORD -->
      <div class="info-row">
        <div class="info-row-left">
          <div class="info-icon gold">🔒</div>
          <div style="min-width:0">
            <div class="info-label">Password</div>
            <div class="info-value pass-value masked" id="passwordValue">••••••••</div>
          </div>
        </div>
        <div style="display:flex;gap:6px;">
          <button class="eye-btn" id="eyeBtn" onclick="togglePassword()" aria-label="Show password">👁</button>
          <button class="copy-btn" id="copyBtn" onclick="copyPassword()" aria-label="Copy password">📋</button>
        </div>
      </div>

      <!-- WALLET BALANCE -->
      <div class="info-row">
        <div class="info-row-left">
          <div class="info-icon green">💰</div>
          <div style="min-width:0">
            <div class="info-label">Wallet Balance</div>
            <div class="info-value balance">
              <span class="coin">₹</span><span id="balanceValue">0</span>
            </div>
          </div>
        </div>
      </div>

    </div>

    <!-- COMING SOON -->
    <div class="coming-soon">
      <div class="coming-soon-inner">
        <div class="cs-icon">🚀</div>
        <div class="cs-title">More Coming Soon</div>
        <p class="cs-sub">
          New features aa rahe hain — profile customization, badges, achievements aur bahut kuch.
        </p>
      </div>
    </div>

    <!-- LOGOUT -->
    <button class="logout-btn" onclick="logoutUser()">⏻ &nbsp; Logout</button>

  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDPIjZjIyUdQBUEni3eaaAa3TWTAit_8y4",
  authDomain: "freefire-tournament-45058.firebaseapp.com",
  projectId: "freefire-tournament-45058",
  storageBucket: "freefire-tournament-45058.firebasestorage.app",
  messagingSenderId: "786635453008",
  appId: "1:786635453008:web:88ee24e0b02bf846619755"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const $ = id => document.getElementById(id);

let realPassword = "";
let passwordVisible = false;
let walletUnsub = null;

/* TOAST */
const toast = $("toast");
let toastTimer;
function notify(msg) {
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("show"), 2200);
}

/* AUTH STATE */
onAuthStateChanged(auth, (user) => {
  if (walletUnsub) { walletUnsub(); walletUnsub = null; }

  if (!user) {
    $("loadingBox").textContent = "Not logged in. Redirecting...";
    setTimeout(() => window.location.href = "wallet.html", 1200);
    return;
  }

  // Load user document live
  walletUnsub = onSnapshot(doc(db, "users", user.uid), (snap) => {
    $("loadingBox").style.display = "none";
    $("profileContent").style.display = "block";

    const data = snap.exists() ? snap.data() : {};

    // Email
    const email = user.email || data.email || "—";
    $("userEmail").textContent = email;
    $("emailValue").textContent = email;

    // Avatar letter (from email)
    const letter = (email[0] || "V").toUpperCase();
    $("avatarLetter").textContent = letter;

    // Model No
    const modelNo = data.modelNo || "Pending";
    $("modelBadge").textContent = "MODEL: " + modelNo;

    // Password — register ke time users collection mein plainPassword field save hoga
    realPassword = data.plainPassword || data.password || "";
    updatePasswordDisplay();

    // Balance
    const balance = Number(data.walletBalance) || 0;
    $("balanceValue").textContent = balance.toFixed(2).replace(/\.00$/, "");
    $("headerWallet").textContent = balance.toFixed(2).replace(/\.00$/, "");

  }, (err) => {
    console.error("Profile sync error:", err);
    $("loadingBox").textContent = "Could not load profile. Try again.";
  });
});

/* PASSWORD SHOW / HIDE */
function updatePasswordDisplay() {
  const el = $("passwordValue");
  if (!realPassword) {
    el.textContent = "— not set —";
    el.classList.remove("masked");
    $("eyeBtn").style.display = "none";
    $("copyBtn").style.display = "none";
    return;
  }
  if (passwordVisible) {
    el.textContent = realPassword;
    el.classList.remove("masked");
    $("eyeBtn").textContent = "🙈";
  } else {
    el.textContent = "•".repeat(Math.min(realPassword.length, 12));
    el.classList.add("masked");
    $("eyeBtn").textContent = "👁";
  }
}

window.togglePassword = () => {
  passwordVisible = !passwordVisible;
  updatePasswordDisplay();
};

window.copyPassword = async () => {
  if (!realPassword) return;
  try {
    await navigator.clipboard.writeText(realPassword);
    const btn = $("copyBtn");
    btn.textContent = "✓";
    btn.classList.add("copied");
    notify("Password copied!");
    setTimeout(() => {
      btn.textContent = "📋";
      btn.classList.remove("copied");
    }, 1500);
  } catch (e) {
    // fallback
    const ta = document.createElement("textarea");
    ta.value = realPassword;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
    notify("Password copied!");
  }
};

window.logoutUser = async () => {
  if (!confirm("Logout kar rahe ho? Aage dobara login karna hoga.")) return;
  try {
    await signOut(auth);
    window.location.href = "wallet.html";
  } catch (e) {
    alert("Logout failed: " + e.message);
  }
};
</script>

</body>
</html>
