<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VZR ESPORTS | Tournaments</title>
<style>
:root {
  --bg: #09090b; --panel: #14151c; --line: #292c36; --red: #ed2638;
  --green: #22c55e; --text: #f5f5f7; --muted: #9ca3af;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
body { 
  background: var(--bg); 
  background-image: radial-gradient(circle at top right, rgba(237, 38, 56, 0.15), transparent 50%),
                    radial-gradient(circle at bottom left, rgba(237, 38, 56, 0.1), transparent 50%);
  background-attachment: fixed;
  color: var(--text); padding-bottom: 50px; min-height: 100vh;
}

/* HEADER */
.header { display: flex; align-items: center; justify-content: space-between; padding: 15px 20px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 10; }
.header-left { display: flex; align-items: center; gap: 15px; }
.header h1 { font-size: 20px; font-weight: 800; letter-spacing: 1px; }
.back-btn { background: transparent; border: none; color: white; font-size: 24px; cursor: pointer; padding: 0 5px; }

/* FILTER & WALLET */
.header-right { display: flex; align-items: center; gap: 8px; }
.filter-container { position: relative; }
.filter-btn { 
  background: var(--panel); border: 1px solid var(--line); color: white; 
  padding: 6px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; 
  cursor: pointer; display: flex; align-items: center; gap: 4px; height: 32px;
}
.filter-menu { 
  display: none; position: absolute; right: 0; top: 38px; background: var(--panel); 
  border: 1px solid var(--line); border-radius: 10px; width: 140px; z-index: 20; 
  overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.5);
}
.filter-menu.show { display: block; }
.filter-menu button { 
  display: block; width: 100%; background: transparent; border: none; color: white; 
  padding: 10px 12px; text-align: left; font-size: 12px; cursor: pointer; 
  border-bottom: 1px solid var(--line);
}
.filter-menu button:last-child { border-bottom: none; }
.filter-menu button:hover { background: rgba(255,255,255,0.05); }

.active-filter { 
  background: #292c36; border: 1px solid var(--line); border-radius: 12px;
  padding: 5px 8px; font-size: 11px; display: none; align-items: center; gap: 6px; height: 32px;
}
.active-filter.show { display: flex; }
.active-filter .x-btn { background: transparent; border: none; color: var(--red); font-weight: bold; cursor: pointer; font-size: 13px; }

.wallet-tag {
  background: var(--panel); border: 1px solid var(--line); color: white;
  padding: 6px 12px; border-radius: 12px; font-size: 12px; font-weight: bold;
  cursor: pointer; display: flex; align-items: center; gap: 4px; text-decoration: none; height: 32px;
}
.wallet-tag .coin { color: #fbbf24; font-size: 12px; }

/* MAIN CONTAINER */
.container { max-width: 500px; margin: 20px auto; padding: 0 15px; display: flex; flex-direction: column; gap: 20px; }

/* TOURNAMENT CARD */
.t-card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
.t-image { width: 100%; height: 180px; object-fit: cover; }
.t-info-box { padding: 15px; }
.t-title { font-size: 16px; font-weight: 700; margin-bottom: 5px; }
.t-date { font-size: 12px; color: var(--muted); margin-bottom: 15px; }

.t-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; text-align: center; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 15px 0; margin-bottom: 15px; }
.stat-item { display: flex; flex-direction: column; gap: 6px; }
.stat-item:not(:last-child) { border-right: 1px solid var(--line); }
.stat-label { font-size: 10px; color: var(--muted); text-transform: uppercase; font-weight: 600; }
.stat-val { font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 3px; }
.coin { font-size: 14px; color: #fbbf24; }
.val-green { color: var(--green); }

.t-sub-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; text-align: center; padding-bottom: 15px; }
.sub-stat { display: flex; flex-direction: column; gap: 4px; }
.sub-label { font-size: 10px; color: var(--muted); text-transform: uppercase; font-weight: 600; }
.sub-val { font-size: 12px; font-weight: 700; }

.progress-container { margin-bottom: 15px; }
.progress-text { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
.progress-bar { width: 100%; height: 6px; background: #292c36; border-radius: 10px; overflow: hidden; }
.progress-fill { height: 100%; background: #a855f7; border-radius: 10px; transition: width 0.3s; }

.t-actions { display: flex; gap: 10px; }
.btn-join { flex: 1; background: var(--green); color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; font-size: 14px; cursor: pointer; outline: none; }
.btn-join.locked { background: #333; color: #777; cursor: not-allowed; }
.btn-detail { flex: 1; background: transparent; color: var(--text); border: 1px solid var(--line); padding: 12px; border-radius: 6px; font-weight: bold; font-size: 14px; cursor: pointer; outline: none; }

/* MODALS */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 100; padding: 15px; }
.modal-overlay.active { display: flex; }
.modal-box { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; width: 100%; max-width: 450px; max-height: 90vh; display: flex; flex-direction: column; animation: pop 0.2s ease-out; overflow: hidden; }
@keyframes pop { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.modal-header { display: flex; align-items: center; padding: 15px; border-bottom: 1px solid var(--line); background: #1c1e26; }
.close-btn { background: #292c36; border: none; color: white; width: 30px; height: 30px; border-radius: 50%; font-size: 14px; cursor: pointer; margin-right: 15px; display: flex; align-items: center; justify-content: center; outline: none; }
.modal-header h2 { font-size: 15px; font-weight: 600; }
.modal-content { padding: 20px; overflow-y: auto; }

/* FORM INPUTS */
.form-group { margin-bottom: 15px; }
.form-group label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
.form-group input { width: 100%; background: #09090b; border: 1px solid var(--line); color: white; padding: 12px; border-radius: 8px; font-size: 14px; outline: none; }

/* SEAT GRID */
.seat-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-top: 15px; }
.seat { background: #1c1e26; border: 1px solid var(--line); color: var(--muted); padding: 10px 0; text-align: center; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; transition: 0.2s; outline: none; }
.seat:hover { border-color: var(--green); color: white; }
.seat.booked { background: #451c25; border-color: #7a2d3c; color: #ff9da7; cursor: not-allowed; }
.seat.selected { background: var(--green); border-color: var(--green); color: white; }

/* CONFIRM BOX */
.confirm-box { background: #09090b; border: 1px dashed var(--line); padding: 15px; border-radius: 8px; margin-top: 15px; display: none; }
.confirm-box.active { display: block; }
.confirm-details { font-size: 13px; margin-bottom: 15px; line-height: 1.6; }
.btn-confirm { width: 100%; background: var(--green); color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; font-size: 14px; cursor: pointer; outline: none; }

/* ERROR TEXT */
.error-text { color: #ff4d4d; font-size: 13px; font-weight: bold; text-align: center; margin-top: 10px; display: none; }

/* DETAILS LIST */
.detail-section { margin-bottom: 20px; }
.detail-title { font-size: 12px; color: var(--muted); font-weight: bold; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
.detail-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #292c36; font-size: 14px; }
.detail-row:last-child { border-bottom: none; }
.rules-text { font-size: 12px; white-space: pre-wrap; color: #d1d5db; }
.player-list { max-height: 200px; overflow-y: auto; margin-top: 10px; }
.player-item { display: flex; justify-content: space-between; background: #09090b; padding: 10px; border-radius: 6px; margin-bottom: 5px; font-size: 12px; border: 1px solid var(--line); }
</style>
</head>
<body>

<header class="header">
  <div class="header-left">
    <button class="back-btn" onclick="window.location.href='lobby.html'">&lt;</button>
    <h1>Tournaments</h1>
  </div>
  
  <div class="header-right">
    <!-- Active Filter Tag -->
    <div class="active-filter" id="activeFilter">
      <span id="filterText">BR</span>
      <button class="x-btn" onclick="clearFilter()">✕</button>
    </div>

    <!-- Filter Button -->
    <div class="filter-container">
      <button class="filter-btn" onclick="toggleFilterMenu()">Filter ▼</button>
      <div class="filter-menu" id="filterMenu">
        <button onclick="applyFilter('BR')">BR (Battle Royale)</button>
        <button onclick="applyFilter('CS')">Clash Squad</button>
        <button onclick="applyFilter('Lone Wolf')">Lone Wolf</button>
      </div>
    </div>

    <!-- Wallet -->
    <a href="deposit.html" class="wallet-tag">
      <span class="coin">₹</span> <span id="userWallet">0</span>
    </a>
  </div>
</header>

<div class="container" id="tournamentList"></div>

<!-- 1. DETAILS MODAL -->
<div class="modal-overlay" id="detailModal">
  <div class="modal-box">
    <div class="modal-header">
      <button class="close-btn" onclick="closeModal('detailModal')">✕</button>
      <h2 id="mTitle">Tournament Details</h2>
    </div>
    <div class="modal-content">
      <div class="detail-section">
        <div class="detail-title">Prize Distribution</div>
        <div class="detail-row"><span>Total Prize Pool</span> <span class="val-green" id="mPrize">₹0</span></div>
        <div class="detail-row"><span>Per Kill</span> <span class="val-green" id="mPerKill">₹0</span></div>
        <div class="detail-row"><span>Booyah / Winner</span> <span class="val-green" id="mBooyah">₹0</span></div>
      </div>
      <div class="detail-section">
        <div class="detail-title">Match Info</div>
        <div class="detail-row"><span>Mode</span> <span id="mMode">-</span></div>
        <div class="detail-row"><span>Map</span> <span id="mMap">-</span></div>
        <div class="detail-row"><span>Date & Time</span> <span id="mDate">-</span></div>
      </div>
      <div class="detail-section" id="rulesSection">
        <div class="detail-title">Rules & Instructions</div>
        <div class="rules-text" id="mRules"></div>
      </div>
      <div class="detail-section">
        <div class="detail-title">Joined Players</div>
        <div class="player-list" id="mPlayersList"></div>
      </div>
    </div>
  </div>
</div>

<!-- 2. JOIN / REGISTRATION MODAL -->
<div class="modal-overlay" id="joinModal">
  <div class="modal-box">
    <div class="modal-header">
      <button class="close-btn" onclick="closeModal('joinModal')">✕</button>
      <h2 id="joinTitle">Join Tournament</h2>
    </div>
    <div class="modal-content">
      <div class="form-group">
        <label>In-Game Name</label>
        <input type="text" id="joinName" placeholder="Enter your Free Fire Name" required>
      </div>
      <div class="form-group">
        <label>Free Fire UID</label>
        <input type="text" id="joinUID" placeholder="Enter your Free Fire UID" required>
      </div>

      <div class="detail-title" style="margin-top:20px;">Select Your Seat</div>
      <div class="seat-grid" id="seatGrid"></div>

      <div class="confirm-box" id="confirmBox">
        <div class="confirm-details" id="confirmDetails"></div>
        <button class="btn-confirm" onclick="confirmBooking()">Confirm Booking</button>
        <div class="error-text" id="bookingError">Insufficient Balance!</div>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, onSnapshot, doc, getDoc, updateDoc, arrayUnion, increment } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDPIjZjIyUdQBUEni3eaaAa3TWTAit_8y4",
  authDomain: "freefire-tournament-45058.firebaseapp.com",
  projectId: "freefire-tournament-45058",
  storageBucket: "freefire-tournament-45058.firebasestorage.app",
  messagingSenderId: "786635453008",
  appId: "1:786635453008:web:88ee24e0b02bf846619755",
  measurementId: "G-X961KLFG3C"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const container = document.getElementById("tournamentList");

let currentTournament = null;
let selectedSeat = null;
let userWalletBalance = 0;
let currentUser = null;
let allTournaments = []; 
let currentFilter = null; 

// 1. Load User & Wallet
onAuthStateChanged(auth, async (user) => {
    if (user) {
        currentUser = user;
        const snap = await getDoc(doc(db, "users", user.uid));
        if (snap.exists()) {
            userWalletBalance = snap.data().walletBalance || 0;
            document.getElementById("userWallet").textContent = userWalletBalance;
        }
    } else {
        document.getElementById("userWallet").textContent = "0";
    }
});

// 2. Load Tournaments
onSnapshot(collection(db, "tournaments"), snapshot => {
  allTournaments = [];
  snapshot.forEach(doc => {
      allTournaments.push({ id: doc.id, ...doc.data() });
  });
  renderTournaments();
});

// 3. Filter Logic
window.toggleFilterMenu = () => {
    document.getElementById("filterMenu").classList.toggle("show");
};

window.applyFilter = (type) => {
    currentFilter = type;
    document.getElementById("filterMenu").classList.remove("show");
    document.getElementById("activeFilter").classList.add("show");
    document.getElementById("filterText").textContent = type;
    renderTournaments();
};

window.clearFilter = () => {
    currentFilter = null;
    document.getElementById("activeFilter").classList.remove("show");
    renderTournaments();
};

// 4. Render Tournaments
function renderTournaments() {
  container.innerHTML = "";
  
  let filtered = allTournaments;
  if (currentFilter) {
      filtered = allTournaments.filter(t => {
          const mode = (t.mode || "").toLowerCase();
          if (currentFilter === "BR") return mode.includes("br");
          if (currentFilter === "CS") return mode.includes("cs");
          if (currentFilter === "Lone Wolf") return mode.includes("lone");
          return true;
      });
  }

  if (filtered.length === 0) {
      container.innerHTML = "<h3 style='text-align:center;color:#9ca3af;margin-top:50px'>No Tournaments Available Right Now!</h3>";
      return;
  }

  filtered.forEach(t => {
    const id = t.id;
    const joined = t.joined || 0;
    const slots = t.slots || 48;
    const left = slots - joined;
    const percent = Math.min((joined / slots) * 100, 100);
    
    const feeText = t.entryFee > 0 ? `₹${t.entryFee}` : 'FREE';
    const feeColor = t.entryFee > 0 ? 'var(--text)' : 'var(--green)';
    const detailData = encodeURIComponent(JSON.stringify(t));

    container.innerHTML += `
      <div class="t-card">
        ${t.imageUrl ? `<img src="${t.imageUrl}" class="t-image">` : ''}
        <div class="t-info-box">
          <div class="t-title">${esc(t.title)}</div>
          <div class="t-date">Time: ${esc(t.date)}</div>

          <div class="t-stats">
            <div class="stat-item"><span class="stat-label">PRIZE POOL</span><span class="stat-val"><span class="coin">₹</span> ${t.prize || 0}</span></div>
            <div class="stat-item"><span class="stat-label">PER KILL</span><span class="stat-val"><span class="coin">₹</span> ${t.perKill || 0}</span></div>
            <div class="stat-item"><span class="stat-label">ENTRY FEE</span><span class="stat-val" style="color: ${feeColor};">${feeText}</span></div>
          </div>

          <div class="t-sub-stats">
            <div class="sub-stat"><span class="sub-label">TYPE</span><span class="sub-val">${esc(t.mode.split(' ')[1] || t.mode)}</span></div>
            <div class="sub-stat"><span class="sub-label">VERSION</span><span class="sub-val">TPP</span></div>
            <div class="sub-stat"><span class="sub-label">MAP</span><span class="sub-val">${esc(t.map).toUpperCase()}</span></div>
          </div>

          <div class="progress-container">
            <div class="progress-text"><span>Only ${left} spots left</span><span>${joined}/${slots}</span></div>
            <div class="progress-bar"><div class="progress-fill" style="width: ${percent}%"></div></div>
          </div>

          <div class="t-actions">
            <button class="btn-join ${left <= 0 ? 'locked' : ''}" onclick="openJoinModal('${id}', ${slots}, ${t.entryFee || 0}, '${encodeURIComponent(JSON.stringify(t.players || []))}')">
              ${left <= 0 ? 'FULL' : 'JOIN NOW'}
            </button>
            <button class="btn-detail" onclick="showDetails('${detailData}')">VIEW DETAILS</button>
          </div>
        </div>
      </div>
    `;
  });
}

function esc(v) { return String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

window.closeModal = (id) => document.getElementById(id).classList.remove("active");

window.showDetails = (encodedData) => {
    const t = JSON.parse(decodeURIComponent(encodedData));
    document.getElementById("mTitle").textContent = t.title;
    document.getElementById("mPrize").textContent = `₹${t.prize || 0}`;
    document.getElementById("mPerKill").textContent = `₹${t.perKill || 0}`;
    document.getElementById("mBooyah").textContent = `₹${t.booyah || 0}`;
    document.getElementById("mMode").textContent = t.mode;
    document.getElementById("mMap").textContent = t.map;
    document.getElementById("mDate").textContent = t.date;
    document.getElementById("mRules").textContent = (t.rules && t.rules.trim() !== "") ? t.rules : "No rules specified.";
    
    const pList = document.getElementById("mPlayersList");
    pList.innerHTML = "";
    if(t.players && t.players.length > 0) {
        t.players.forEach(p => {
            pList.innerHTML += `<div class="player-item"><span>${esc(p.name)}</span> <span>Seat: ${p.seat}</span></div>`;
        });
    } else {
        pList.innerHTML = "<div style='font-size:12px; color:var(--muted)'>No players joined yet.</div>";
    }

    document.getElementById("detailModal").classList.add("active");
};

window.openJoinModal = (id, slots, fee, playersData) => {
    if(!currentUser) {
        alert("Please login first to join tournament!");
        window.location.href = "wallet.html";
        return;
    }
    
    currentTournament = { id, slots, fee };
    const players = JSON.parse(decodeURIComponent(playersData));
    selectedSeat = null;

    document.getElementById("joinModal").classList.add("active");
    document.getElementById("confirmBox").classList.remove("active");
    document.getElementById("bookingError").style.display = "none";
    
    const seatGrid = document.getElementById("seatGrid");
    seatGrid.innerHTML = "";
    
    const maxSeats = Math.min(slots, 100); 
    
    for(let i = 1; i <= maxSeats; i++) {
        const isBooked = players.some(p => p.seat === i);
        seatGrid.innerHTML += `<div class="seat ${isBooked ? 'booked' : ''}" data-seat="${i}" onclick="selectSeat(${i}, ${isBooked})">${i}</div>`;
    }
};

window.selectSeat = (seatNum, isBooked) => {
    if(isBooked) return;
    document.querySelectorAll(".seat.selected").forEach(el => el.classList.remove("selected"));
    const seatEl = document.querySelector(`.seat[data-seat="${seatNum}"]`);
    if(seatEl) seatEl.classList.add("selected");
    selectedSeat = seatNum;
    
    const fee = currentTournament.fee || 0;
    document.getElementById("confirmDetails").innerHTML = `
        <div>Seat Selected: <b>#${seatNum}</b></div>
        <div>Entry Fee: <b>₹${fee}</b></div>
    `;
    document.getElementById("confirmBox").classList.add("active");
};

window.confirmBooking = async () => {
    const name = document.getElementById("joinName").value.trim();
    const uid = document.getElementById("joinUID").value.trim();
    const errorText = document.getElementById("bookingError");
    
    if(!name || !uid) { alert("Please enter Name and UID!"); return; }
    if(!selectedSeat) { alert("Please select a seat!"); return; }
    
    const fee = currentTournament.fee || 0;
    
    const userSnap = await getDoc(doc(db, "users", currentUser.uid));
    const freshBalance = userSnap.data().walletBalance || 0;

    if(freshBalance < fee) {
        errorText.style.display = "block";
        return;
    }
    
    const btn = document.querySelector(".btn-confirm");
    btn.disabled = true; btn.textContent = "BOOKING...";
    errorText.style.display = "none";
    
    try {
        await updateDoc(doc(db, "users", currentUser.uid), {
            walletBalance: increment(-fee)
        });
        
        await updateDoc(doc(db, "tournaments", currentTournament.id), {
            joined: increment(1),
            players: arrayUnion({ name: name, uid: uid, seat: selectedSeat, userId: currentUser.uid })
        });
        
        userWalletBalance = freshBalance - fee;
        document.getElementById("userWallet").textContent = userWalletBalance;
        
        alert(`Success! Seat #${selectedSeat} booked. ₹${fee} deducted.`);
        closeModal('joinModal');
        
    } catch (e) {
        alert("Error: " + e.message);
    }
    
    btn.disabled = false; btn.textContent = "Confirm Booking";
};
</script>
</body>
</html>
